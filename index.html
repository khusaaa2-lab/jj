<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#164F48" />
    <meta
      name="description"
      content="A dream school shaped around curiosity, creativity and belonging. Explore the interactive Serenity International School campus."
    />
    <title>Serenity International School — Room to become</title>
    <link rel="icon" type="image/svg+xml" href="/assets/emblem.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app"></div>
    <div id="notice" class="toast" role="status" aria-live="polite"></div>
    <dialog id="message-dialog" aria-labelledby="dialog-title">
      <button class="icon-button dialog-close" aria-label="Close dialog">
        ×</button
      ><span class="eyebrow">STAY CONNECTED</span>
      <h2 id="dialog-title">A conversation, coming soon.</h2>
      <p>
        The Serenity Telegram companion is a future project. For now, explore
        the campus, try a local demo or save an idea on Our Project.
      </p>
      <p class="muted">
        No messages are sent and no external account is connected.
      </p>
      <button class="button dialog-close">
        Keep exploring <span>↗</span>
      </button>
    </dialog>
    <noscript
      ><main class="section">
        <h1>Serenity International School</h1>
        <p>
          A dream school shaped around curiosity, creativity and belonging.
          Enable JavaScript for the interactive campus and local demonstrations.
        </p>
        <a href="/data/places.json">Read the thirteen campus places</a>
      </main></noscript
    >
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
